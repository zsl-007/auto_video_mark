<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Anonymizer · 视频匿名化系统</title>
<style>
/* ========== Reset ========== */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
button, input, select { font: inherit; color: inherit; }

/* ========== Theme tokens ========== */
:root {
  --bg: #f6f7f9;
  --panel: #ffffff;
  --border: #e5e7eb;
  --border-strong: #d1d5db;
  --text: #111827;
  --text-muted: #6b7280;
  --primary: #4f46e5;
  --primary-hover: #4338ca;
  --primary-soft: rgba(79,70,229,.1);
  --success: #059669;
  --success-bg: #d1fae5;
  --warning: #b45309;
  --warning-bg: #fef3c7;
  --danger: #dc2626;
  --danger-bg: #fee2e2;
  --info: #2563eb;
  --info-bg: #dbeafe;
  --muted-bg: #f3f4f6;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 1px 3px rgba(0,0,0,.06);
  --shadow-lg: 0 10px 30px rgba(0,0,0,.12);
  --radius: 10px;
  --radius-sm: 6px;
}
[data-theme="dark"] {
  --bg: #0f1115;
  --panel: #171a21;
  --border: #262b34;
  --border-strong: #363c47;
  --text: #e5e7eb;
  --text-muted: #9ca3af;
  --primary: #818cf8;
  --primary-hover: #a5b4fc;
  --primary-soft: rgba(129,140,248,.15);
  --success: #34d399;
  --success-bg: rgba(52,211,153,.15);
  --warning: #fbbf24;
  --warning-bg: rgba(251,191,36,.15);
  --danger: #f87171;
  --danger-bg: rgba(248,113,113,.15);
  --info: #60a5fa;
  --info-bg: rgba(96,165,250,.15);
  --muted-bg: #1f232b;
  --shadow: 0 1px 2px rgba(0,0,0,.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,.5);
}

/* ========== Base ========== */
body {
  background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
               "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  font-size: 14px; line-height: 1.5; min-height: 100vh;
  transition: background .2s, color .2s;
}
h1, h2, h3 { margin: 0; font-weight: 600; }
h1 { font-size: 18px; }
h2 { font-size: 15px; }
a { color: var(--primary); text-decoration: none; }
a:hover { text-decoration: underline; }
code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }

/* ========== Topbar ========== */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 24px; background: var(--panel);
  border-bottom: 1px solid var(--border); backdrop-filter: blur(6px);
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-logo {
  width: 36px; height: 36px; border-radius: 9px;
  background: linear-gradient(135deg, var(--primary), #7c3aed);
  display: grid; place-items: center; color: #fff; font-weight: 700;
}
.brand-text h1 { font-size: 16px; letter-spacing: -.01em; }
.brand-text p { margin: 0; font-size: 12px; color: var(--text-muted); }
.topbar-actions { display: flex; align-items: center; gap: 10px; }

.ws-status {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 500;
  background: var(--muted-bg); color: var(--text-muted);
  transition: background .2s, color .2s;
}
.ws-status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border-strong); }
.ws-status.open { background: var(--success-bg); color: var(--success); }
.ws-status.open .dot { background: var(--success); box-shadow: 0 0 0 3px rgba(5,150,105,.2); }
.ws-status.connecting, .ws-status.reconnecting { background: var(--warning-bg); color: var(--warning); }
.ws-status.connecting .dot, .ws-status.reconnecting .dot { background: var(--warning); animation: pulse 1.2s infinite; }
.ws-status.closed { background: var(--danger-bg); color: var(--danger); }
.ws-status.closed .dot { background: var(--danger); }
@keyframes pulse { 50% { opacity: .4; } }

/* ========== Buttons ========== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 7px 14px; border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong); background: var(--panel);
  color: var(--text); cursor: pointer; font-weight: 500; font-size: 13px;
  transition: background .15s, border-color .15s, transform .05s;
  white-space: nowrap;
}
.btn:hover { background: var(--muted-bg); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn.primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
.btn.small { padding: 4px 10px; font-size: 12px; }
.btn.icon-only { width: 34px; height: 34px; padding: 0; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--text-muted); }
.btn.ghost:hover { background: var(--muted-bg); color: var(--text); }

/* ========== Inputs ========== */
input[type="search"], select {
  padding: 7px 12px; border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong); background: var(--panel);
  color: var(--text); font-size: 13px; outline: none;
  transition: border-color .15s, box-shadow .15s;
}
input[type="search"]:focus, select:focus {
  border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft);
}
input[type="search"] { min-width: 220px; }

/* ========== Layout ========== */
main { max-width: 1400px; margin: 0 auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; }

/* ========== Stats ========== */
.stats-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px;
}
.stat-card {
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px 18px; box-shadow: var(--shadow);
  display: flex; align-items: center; gap: 14px;
  transition: transform .15s, box-shadow .15s;
}
.stat-card:hover { transform: translateY(-1px); box-shadow: var(--shadow-lg); }
.stat-icon {
  width: 42px; height: 42px; border-radius: 10px; flex-shrink: 0;
  display: grid; place-items: center; font-size: 20px;
  background: var(--primary-soft); color: var(--primary);
}
.stat-card.running .stat-icon { background: var(--info-bg); color: var(--info); }
.stat-card.completed .stat-icon { background: var(--success-bg); color: var(--success); }
.stat-card.failed .stat-icon { background: var(--danger-bg); color: var(--danger); }
.stat-card.dropped .stat-icon { background: var(--warning-bg); color: var(--warning); }
.stat-meta { min-width: 0; }
.stat-value { font-size: 24px; font-weight: 700; letter-spacing: -.02em; }
.stat-label { font-size: 12px; color: var(--text-muted); }

/* ========== Panel ========== */
.panel {
  background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); overflow: hidden;
}
.panel-header {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.panel-header h2 { font-size: 14px; }
.filters { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

/* ========== Upload panel ========== */
.upload-zone {
  margin: 16px;
  padding: 30px 20px;
  border: 2px dashed var(--border-strong);
  border-radius: var(--radius);
  text-align: center;
  transition: background .15s, border-color .15s;
  cursor: pointer;
}
.upload-zone:hover, .upload-zone.dragover {
  background: var(--primary-soft);
  border-color: var(--primary);
}
.upload-zone.dragover { transform: scale(1.005); }
.upload-icon { font-size: 34px; margin-bottom: 8px; line-height: 1; }
.upload-title { margin: 0 0 4px; font-weight: 500; font-size: 14px; }
.upload-title a { color: var(--primary); }
.upload-hint { margin: 0; font-size: 12px; color: var(--text-muted); }

.upload-list {
  list-style: none; margin: 0 16px 16px; padding: 0;
  display: flex; flex-direction: column; gap: 8px;
}
.upload-list:empty { display: none; }
.upload-item {
  padding: 10px 14px; border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  display: flex; flex-direction: column; gap: 6px;
  animation: toastIn .25s ease;
}
.upload-item-row {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; font-size: 13px;
}
.upload-name {
  font-weight: 500; flex: 1;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.upload-meta { color: var(--text-muted); font-size: 12px; flex-shrink: 0; }
.upload-item.done { border-color: var(--success); background: var(--success-bg); }
.upload-item.error { border-color: var(--danger); background: var(--danger-bg); }
.upload-item.done .upload-meta,
.upload-item.done .progress-text { color: var(--success); }
.upload-item.error .upload-meta,
.upload-item.error .progress-text { color: var(--danger); }

/* ========== Table ========== */
.table-wrap { overflow-x: auto; }
.tasks-table { width: 100%; border-collapse: collapse; min-width: 820px; }
.tasks-table th, .tasks-table td {
  text-align: left; padding: 12px 16px; font-size: 13px;
  border-bottom: 1px solid var(--border); vertical-align: middle;
}
.tasks-table th {
  font-weight: 600; color: var(--text-muted); font-size: 12px;
  text-transform: uppercase; letter-spacing: .04em; background: var(--muted-bg);
}
.tasks-table tbody tr { transition: background .1s; cursor: pointer; }
.tasks-table tbody tr:hover { background: var(--muted-bg); }
.tasks-table tbody tr:last-child td { border-bottom: none; }
.tasks-table td.empty { text-align: center; color: var(--text-muted); padding: 40px 16px; cursor: default; }
.tasks-table td.empty:hover { background: transparent; }

.file-name {
  display: inline-flex; align-items: center; gap: 6px;
  max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-weight: 500;
}
.file-name .icon { color: var(--text-muted); flex-shrink: 0; }
.muted { color: var(--text-muted); }

/* ========== Badge ========== */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 500;
  white-space: nowrap;
}
.badge .dot { width: 6px; height: 6px; border-radius: 50%; }
.badge.pending { background: var(--muted-bg); color: var(--text-muted); }
.badge.pending .dot { background: var(--text-muted); }
.badge.running { background: var(--info-bg); color: var(--info); }
.badge.running .dot { background: var(--info); animation: pulse 1.2s infinite; }
.badge.completed { background: var(--success-bg); color: var(--success); }
.badge.completed .dot { background: var(--success); }
.badge.failed { background: var(--danger-bg); color: var(--danger); }
.badge.failed .dot { background: var(--danger); }

/* ========== Progress ========== */
.progress { display: flex; align-items: center; gap: 8px; min-width: 130px; }
.progress-bar { flex: 1; height: 6px; background: var(--muted-bg); border-radius: 3px; overflow: hidden; }
.progress-fill {
  height: 100%; border-radius: 3px;
  background: linear-gradient(90deg, var(--info), var(--primary));
  transition: width .4s ease;
}
.progress-fill.running {
  background: linear-gradient(90deg, var(--info), var(--primary), var(--info));
  background-size: 200% 100%;
  animation: shimmer 1.6s linear infinite;
}
.progress-fill.completed { background: var(--success); }
.progress-fill.failed { background: var(--danger); }
@keyframes shimmer { to { background-position: -200% 0; } }
.progress-text {
  font-size: 12px; color: var(--text-muted);
  min-width: 34px; text-align: right; font-variant-numeric: tabular-nums;
}

/* ========== Two column ========== */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 960px) { .two-col { grid-template-columns: 1fr; } }

/* ========== Error list ========== */
.error-list { list-style: none; margin: 0; padding: 0; max-height: 360px; overflow-y: auto; }
.error-list li {
  padding: 12px 18px; border-bottom: 1px solid var(--border);
  display: flex; gap: 10px; align-items: flex-start; font-size: 13px;
}
.error-list li:last-child { border-bottom: none; }
.error-list li.empty { color: var(--text-muted); justify-content: center; padding: 30px; }
.error-stage {
  flex-shrink: 0; padding: 2px 8px; border-radius: var(--radius-sm);
  background: var(--danger-bg); color: var(--danger);
  font-size: 11px; font-weight: 600; text-transform: uppercase;
}
.error-body { min-width: 0; flex: 1; }
.error-msg { word-break: break-word; }
.error-meta { font-size: 11px; color: var(--text-muted); margin-top: 3px; }

/* ========== Settings ========== */
.settings-list { margin: 0; padding: 6px 0; }
.settings-list .row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 18px; border-bottom: 1px solid var(--border); font-size: 13px;
}
.settings-list .row:last-child { border-bottom: none; }
.settings-list .row dt { color: var(--text-muted); }
.settings-list .row dd { margin: 0; font-weight: 500; font-variant-numeric: tabular-nums; }
.settings-list .empty { color: var(--text-muted); padding: 30px; text-align: center; }

/* ========== Drawer ========== */
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; z-index: 40;
  width: min(560px, 100vw); background: var(--panel); border-left: 1px solid var(--border);
  box-shadow: var(--shadow-lg); transform: translateX(100%);
  transition: transform .25s ease; display: flex; flex-direction: column;
}
.drawer.open { transform: translateX(0); }
.drawer-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 20px; border-bottom: 1px solid var(--border);
}
.drawer-body { padding: 18px 20px; overflow-y: auto; flex: 1; }
.drawer-backdrop {
  position: fixed; inset: 0; z-index: 30;
  background: rgba(0,0,0,.4); opacity: 0; pointer-events: none;
  transition: opacity .25s;
}
.drawer-backdrop.show { opacity: 1; pointer-events: auto; }

.kv { display: grid; grid-template-columns: 110px 1fr; gap: 8px 12px; font-size: 13px; }
.kv dt { color: var(--text-muted); }
.kv dd { margin: 0; word-break: break-all; }
.drawer-section { margin-top: 22px; }
.drawer-section h3 {
  font-size: 12px; text-transform: uppercase; letter-spacing: .05em;
  color: var(--text-muted); margin-bottom: 10px;
}
.segment-list {
  list-style: none; margin: 0; padding: 0;
  border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden;
}
.segment-list li {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 12px; font-size: 12px; border-bottom: 1px solid var(--border);
}
.segment-list li:last-child { border-bottom: none; }
.segment-list .seg-meta { color: var(--text-muted); }

/* ========== Toast ========== */
.toast-container {
  position: fixed; bottom: 20px; right: 20px; z-index: 60;
  display: flex; flex-direction: column; gap: 8px;
}
.toast {
  padding: 10px 16px; border-radius: var(--radius-sm);
  background: var(--panel); border: 1px solid var(--border);
  box-shadow: var(--shadow-lg); font-size: 13px;
  min-width: 220px; max-width: 360px;
  animation: toastIn .25s ease;
}
.toast.success { border-left: 3px solid var(--success); }
.toast.error { border-left: 3px solid var(--danger); }
.toast.info { border-left: 3px solid var(--info); }
@keyframes toastIn { from { transform: translateY(10px); opacity: 0; } }

/* ========== Responsive ========== */
@media (max-width: 640px) {
  main { padding: 14px; gap: 14px; }
  .topbar { padding: 10px 14px; }
  .brand-text p { display: none; }
  .panel-header { padding: 12px 14px; }
  .filters { width: 100%; }
  .filters input[type="search"] { flex: 1; min-width: 0; }
  .kv { grid-template-columns: 90px 1fr; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-logo">VA</div>
    <div class="brand-text">
      <h1>Video Anonymizer</h1>
      <p>视频匿名化流水线</p>
    </div>
  </div>
  <div class="topbar-actions">
    <div class="ws-status connecting" id="ws-status"><span class="dot"></span> 连接中</div>
    <button class="btn small" id="refresh-btn" title="刷新数据">刷新</button>
    <button class="btn icon-only" id="theme-btn" title="切换主题">🌙</button>
  </div>
</header>

<main>
  <section class="stats-grid" id="stats-grid"></section>

  <section class="panel">
    <div class="panel-header">
      <h2>上传视频</h2>
      <span class="muted" id="upload-status"></span>
    </div>
    <div class="upload-zone" id="upload-zone">
      <input type="file" id="file-input" multiple accept=".mp4,.mov,.mkv,.avi" hidden>
      <div class="upload-icon">📤</div>
      <p class="upload-title">拖拽视频到此处，或 <a href="#" id="browse-link">点击选择文件</a></p>
      <p class="upload-hint" id="upload-hint">支持 MP4 / MOV / MKV / AVI，单文件 ≤ 2 GB</p>
    </div>
    <ul class="upload-list" id="upload-list"></ul>
  </section>

  <section class="panel">
    <div class="panel-header">
      <h2>任务列表</h2>
      <div class="filters">
        <input type="search" id="search-input" placeholder="搜索文件名或任务 ID...">
        <select id="status-filter">
          <option value="">全部状态</option>
          <option value="queued">排队中</option>
          <option value="prechecking">预检中</option>
          <option value="segmenting">分段中</option>
          <option value="static_checking">静态检测中</option>
          <option value="anonymizing">匿名化中</option>
          <option value="merging">合并中</option>
          <option value="completed">已完成</option>
          <option value="failed">失败</option>
        </select>
      </div>
    </div>
    <div class="table-wrap">
      <table class="tasks-table">
        <thead>
          <tr>
            <th>状态</th>
            <th>源文件</th>
            <th>进度</th>
            <th>输出</th>
            <th>创建时间</th>
            <th>耗时</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tasks-body">
          <tr><td colspan="7" class="empty">加载中...</td></tr>
        </tbody>
      </table>
    </div>
  </section>

  <div class="two-col">
    <section class="panel">
      <div class="panel-header">
        <h2>错误日志</h2>
        <button class="btn small ghost" id="clear-errors" title="清空当前视图">清空显示</button>
      </div>
      <ul class="error-list" id="error-list">
        <li class="empty">加载中...</li>
      </ul>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2>运行配置</h2>
      </div>
      <dl class="settings-list" id="settings-list">
        <dd class="empty">加载中...</dd>
      </dl>
    </section>
  </div>
</main>

<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-header">
    <h2>任务详情</h2>
    <button class="btn icon-only ghost" id="drawer-close" aria-label="关闭">✕</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>
<div class="drawer-backdrop" id="drawer-backdrop"></div>

<div class="toast-container" id="toast-container"></div>

<script>
(function () {
  'use strict';

  // ============ 常量 ============
  const STATUS_LABELS = {
    queued: '排队中',
    prechecking: '预检中',
    segmenting: '分段中',
    static_checking: '静态检测中',
    anonymizing: '匿名化中',
    merging: '合并中',
    completed: '已完成',
    failed: '失败',
  };
  const STATUS_PROGRESS = {
    queued: 0, prechecking: 10, segmenting: 25,
    static_checking: 40, anonymizing: 65, merging: 90,
    completed: 100, failed: 100,
  };
  const RUNNING_STATUSES = new Set([
    'prechecking', 'segmenting', 'static_checking', 'anonymizing', 'merging',
  ]);
  const SETTING_LABELS = {
    segment_duration: { label: '分段时长', fmt: v => `${v} 秒` },
    segment_enabled: { label: '启用分段', fmt: v => v ? '是' : '否' },
    static_threshold: { label: '静态阈值', fmt: v => v },
    anonymize_face: { label: '人脸匿名化', fmt: v => v ? '开启' : '关闭' },
    anonymize_plate: { label: '车牌匿名化', fmt: v => v ? '开启' : '关闭' },
    blur_method: { label: '模糊方式', fmt: v => v === 'pixelate' ? '马赛克' : '高斯模糊' },
    merge_enabled: { label: '启用合并', fmt: v => v ? '是' : '否' },
    max_upload_size: { label: '最大上传', fmt: v => formatBytes(v) },
    supported_extensions: { label: '支持格式', fmt: v => (v || []).map(e => e.replace('.', '').toUpperCase()).join(' / ') },
  };

  // ============ 状态 ============
  const state = {
    tasks: [], errors: [], settings: null, summary: null,
    filter: { status: '', q: '' },
    ws: null, wsRetry: 0, lastErrorCount: 0,
  };

  // ============ DOM ============
  const $ = sel => document.querySelector(sel);
  const els = {
    statsGrid: $('#stats-grid'),
    tasksBody: $('#tasks-body'),
    errorList: $('#error-list'),
    settingsList: $('#settings-list'),
    searchInput: $('#search-input'),
    statusFilter: $('#status-filter'),
    refreshBtn: $('#refresh-btn'),
    themeBtn: $('#theme-btn'),
    wsStatus: $('#ws-status'),
    drawer: $('#drawer'),
    drawerBody: $('#drawer-body'),
    drawerClose: $('#drawer-close'),
    drawerBackdrop: $('#drawer-backdrop'),
    clearErrors: $('#clear-errors'),
    toastContainer: $('#toast-container'),
    uploadZone: $('#upload-zone'),
    fileInput: $('#file-input'),
    uploadList: $('#upload-list'),
    uploadHint: $('#upload-hint'),
    browseLink: $('#browse-link'),
  };

  // ============ 工具函数 ============
  function escapeHtml(s) {
    if (s == null) return '';
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }
  function parseUTC(iso) {
    if (!iso) return null;
    if (iso instanceof Date) return iso;
    if (/[zZ]|[+-]\d{2}:?\d{2}$/.test(iso)) return new Date(iso);
    return new Date(iso + 'Z');
  }
  function timeAgo(iso) {
    const d = parseUTC(iso);
    if (!d || isNaN(d)) return '-';
    const diff = (Date.now() - d.getTime()) / 1000;
    if (diff < 60) return '刚刚';
    if (diff < 3600) return `${Math.floor(diff / 60)} 分钟前`;
    if (diff < 86400) return `${Math.floor(diff / 3600)} 小时前`;
    if (diff < 604800) return `${Math.floor(diff / 86400)} 天前`;
    return d.toLocaleDateString('zh-CN');
  }
  function fmtAbsolute(iso) {
    const d = parseUTC(iso);
    if (!d || isNaN(d)) return '-';
    return d.toLocaleString('zh-CN', { hour12: false });
  }
  function fmtDuration(sec) {
    if (sec < 60) return `${Math.floor(sec)} 秒`;
    if (sec < 3600) return `${Math.floor(sec / 60)} 分 ${Math.floor(sec % 60)} 秒`;
    return `${Math.floor(sec / 3600)} 时 ${Math.floor((sec % 3600) / 60)} 分`;
  }
  function taskDuration(task) {
    const a = parseUTC(task.created_at);
    const b = parseUTC(task.updated_at);
    if (!a || !b) return '-';
    return fmtDuration(Math.max(0, (b - a) / 1000));
  }
  function basename(p) {
    if (!p) return '';
    return p.split(/[\\/]/).pop();
  }
  function statusClass(status) {
    if (status === 'completed') return 'completed';
    if (status === 'failed') return 'failed';
    if (RUNNING_STATUSES.has(status)) return 'running';
    return 'pending';
  }
  function debounce(fn, ms) {
    let t;
    return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
  }
  function showToast(msg, type = 'info', timeout = 3000) {
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.textContent = msg;
    els.toastContainer.appendChild(el);
    setTimeout(() => {
      el.style.opacity = '0';
      el.style.transform = 'translateY(6px)';
      el.style.transition = 'opacity .25s, transform .25s';
      setTimeout(() => el.remove(), 250);
    }, timeout);
  }
  function formatBytes(bytes) {
    if (bytes == null) return '-';
    if (bytes < 1024) return `${bytes} B`;
    if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
    if (bytes < 1024 * 1024 * 1024) return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
    return `${(bytes / 1024 / 1024 / 1024).toFixed(2)} GB`;
  }

  // ============ API 封装 ============
  async function api(path, opts = {}) {
    const res = await fetch(path, {
      headers: { Accept: 'application/json', ...(opts.headers || {}) },
      ...opts,
    });
    if (!res.ok) {
      const text = await res.text().catch(() => '');
      throw new Error(`${res.status} ${res.statusText}${text ? ': ' + text.slice(0, 200) : ''}`);
    }
    const ct = res.headers.get('content-type') || '';
    if (!ct.includes('application/json')) return null;
    return res.json();
  }

  // ============ 渲染：统计卡片 ============
  function computeStats() {
    const total = state.tasks.length;
    const running = state.tasks.filter(t => RUNNING_STATUSES.has(t.status)).length;
    const completed = state.tasks.filter(t => t.status === 'completed').length;
    const failed = state.tasks.filter(t => t.status === 'failed').length;
    const dropped = state.summary ? (state.summary.segments_dropped || 0) : 0;
    return { total, running, completed, failed, dropped };
  }
  function renderStats() {
    const s = computeStats();
    const cards = [
      { icon: '📋', value: s.total, label: '总任务', cls: '' },
      { icon: '⏳', value: s.running, label: '处理中', cls: 'running' },
      { icon: '✅', value: s.completed, label: '已完成', cls: 'completed' },
      { icon: '❌', value: s.failed, label: '失败', cls: 'failed' },
      { icon: '🗑️', value: s.dropped, label: '丢弃分段', cls: 'dropped' },
    ];
    els.statsGrid.innerHTML = cards.map(c => `
      <div class="stat-card ${c.cls}">
        <div class="stat-icon">${c.icon}</div>
        <div class="stat-meta">
          <div class="stat-value">${c.value}</div>
          <div class="stat-label">${c.label}</div>
        </div>
      </div>
    `).join('');
  }

  // ============ 渲染：任务列表 ============
  function matchesFilter(task) {
    const f = state.filter;
    if (f.status && task.status !== f.status) return false;
    if (f.q) {
      const q = f.q.toLowerCase();
      const hay = `${task.id} ${task.source_path || ''} ${task.output_path || ''}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  }
  function renderTasks() {
    const rows = state.tasks.filter(matchesFilter);
    if (state.tasks.length === 0) {
      els.tasksBody.innerHTML = `<tr><td colspan="7" class="empty">暂无任务。在上方上传视频，或将文件放入 input/ 目录。</td></tr>`;
      return;
    }
    if (rows.length === 0) {
      els.tasksBody.innerHTML = `<tr><td colspan="7" class="empty">没有匹配的任务。</td></tr>`;
      return;
    }
    els.tasksBody.innerHTML = rows.map(renderTaskRow).join('');
  }
  function renderTaskRow(task) {
    const cls = statusClass(task.status);
    const progress = STATUS_PROGRESS[task.status] ?? 0;
    const outName = task.output_path ? basename(task.output_path) : '';
    const download = task.output_path
      ? `<a href="/output/${encodeURIComponent(outName)}" download
            class="file-name" title="下载输出文件"
            onclick="event.stopPropagation()">${escapeHtml(outName)}</a>`
      : '<span class="muted">-</span>';

    return `<tr data-task-id="${escapeHtml(task.id)}" tabindex="0">
      <td><span class="badge ${cls}"><span class="dot"></span>${escapeHtml(STATUS_LABELS[task.status] || task.status)}</span></td>
      <td>
        <span class="file-name" title="${escapeHtml(task.source_path)}">
          <span class="icon">🎞️</span>${escapeHtml(basename(task.source_path))}
        </span>
      </td>
      <td>
        <div class="progress">
          <div class="progress-bar">
            <div class="progress-fill ${cls}" style="width:${progress}%"></div>
          </div>
          <span class="progress-text">${progress}%</span>
        </div>
      </td>
      <td>${download}</td>
      <td title="${escapeHtml(fmtAbsolute(task.created_at))}">${timeAgo(task.created_at)}</td>
      <td class="muted">${taskDuration(task)}</td>
      <td><button class="btn small ghost" data-action="detail">详情</button></td>
    </tr>`;
  }

  // ============ 渲染：错误日志 ============
  function renderErrors() {
    if (!state.errors.length) {
      els.errorList.innerHTML = `<li class="empty">暂无错误记录。</li>`;
      return;
    }
    els.errorList.innerHTML = state.errors.slice(0, 80).map(e => `
      <li>
        <span class="error-stage">${escapeHtml(e.stage || 'unknown')}</span>
        <div class="error-body">
          <div class="error-msg">${escapeHtml(e.message || '')}</div>
          <div class="error-meta" title="${escapeHtml(fmtAbsolute(e.created_at))}">
            ${e.task_id ? '任务 ' + escapeHtml(e.task_id.slice(0, 8)) + ' · ' : ''}${timeAgo(e.created_at)}
          </div>
        </div>
      </li>
    `).join('');
  }

  // ============ 渲染：运行配置 ============
  function renderSettings() {
    if (!state.settings) {
      els.settingsList.innerHTML = `<dd class="empty">加载中...</dd>`;
      return;
    }
    const rows = Object.entries(state.settings).map(([k, v]) => {
      const meta = SETTING_LABELS[k];
      const label = meta ? meta.label : k;
      const val = meta ? meta.fmt(v) : String(v);
      return `<div class="row"><dt>${escapeHtml(label)}</dt><dd>${escapeHtml(val)}</dd></div>`;
    });
    els.settingsList.innerHTML = rows.length ? rows.join('') : `<dd class="empty">暂无配置信息</dd>`;

    // 同步更新上传提示
    const max = state.settings.max_upload_size;
    const exts = state.settings.supported_extensions;
    let hint = '拖拽视频到此处，或点击选择文件';
    if (exts && exts.length) hint += `（支持 ${exts.map(e => e.replace('.', '').toUpperCase()).join(' / ')}）`;
    if (max) hint += `，单文件 ≤ ${formatBytes(max)}`;
    els.uploadHint.textContent = hint;
  }

  // ============ 任务详情抽屉 ============
  async function openDrawer(taskId) {
    const task = state.tasks.find(t => t.id === taskId);
    if (!task) return;

    els.drawer.classList.add('open');
    els.drawer.setAttribute('aria-hidden', 'false');
    els.drawerBackdrop.classList.add('show');
    renderDrawer(task, undefined, []);

    const taskErrors = state.errors.filter(e => e.task_id === taskId);
    let segments = null;
    try {
      segments = await api(`/api/tasks/${encodeURIComponent(taskId)}/segments`);
    } catch (_) {
      segments = null;
    }
    renderDrawer(task, segments, taskErrors);
  }
  function renderDrawer(task, segments, taskErrors) {
    const cls = statusClass(task.status);
    const outName = task.output_path ? basename(task.output_path) : '';

    const segmentsHtml = (() => {
      if (segments === undefined) return `<p class="muted">加载中...</p>`;
      if (segments === null) return `<p class="muted">当前后端未提供分段明细接口。</p>`;
      if (!Array.isArray(segments) || segments.length === 0) return `<p class="muted">暂无分段记录。</p>`;
      return `<ul class="segment-list">
        ${segments.map(s => {
          const sc = s.status === 'dropped' ? 'failed' : s.status === 'kept' ? 'completed' : 'pending';
          const label = s.status === 'dropped' ? '丢弃' : s.status === 'kept' ? '保留' : '待定';
          const ratio = s.frame_ratio != null ? `保留帧比例 ${(s.frame_ratio * 100).toFixed(1)}%` : '';
          return `<li>
            <span>#${s.index} <span class="badge ${sc}"><span class="dot"></span>${label}</span></span>
            <span class="seg-meta">${escapeHtml(ratio)} · ${escapeHtml(basename(s.path))}</span>
          </li>`;
        }).join('')}
      </ul>`;
    })();

    const errorsHtml = taskErrors && taskErrors.length
      ? `<ul class="error-list" style="border:1px solid var(--border);border-radius:var(--radius-sm);">
          ${taskErrors.map(e => `
            <li>
              <span class="error-stage">${escapeHtml(e.stage)}</span>
              <div class="error-body">
                <div class="error-msg">${escapeHtml(e.message)}</div>
                <div class="error-meta">${escapeHtml(fmtAbsolute(e.created_at))}</div>
              </div>
            </li>`).join('')}
        </ul>`
      : `<p class="muted">无错误记录。</p>`;

    els.drawerBody.innerHTML = `
      <dl class="kv">
        <dt>任务 ID</dt><dd class="mono">${escapeHtml(task.id)}</dd>
        <dt>状态</dt><dd><span class="badge ${cls}"><span class="dot"></span>${escapeHtml(STATUS_LABELS[task.status] || task.status)}</span></dd>
        <dt>源文件</dt><dd>${escapeHtml(task.source_path)}</dd>
        <dt>输出文件</dt><dd>${outName
          ? `<a href="/output/${encodeURIComponent(outName)}" download>${escapeHtml(outName)}</a>`
          : '<span class="muted">-</span>'}</dd>
        <dt>创建时间</dt><dd>${escapeHtml(fmtAbsolute(task.created_at))}</dd>
        <dt>更新时间</dt><dd>${escapeHtml(fmtAbsolute(task.updated_at))}</dd>
        <dt>耗时</dt><dd>${taskDuration(task)}</dd>
        <dt>重试次数</dt><dd>${task.retry_count ?? 0}</dd>
        ${task.error_message ? `<dt>错误</dt><dd style="color:var(--danger)">${escapeHtml(task.error_message)}</dd>` : ''}
      </dl>
      <div class="drawer-section"><h3>分段明细</h3>${segmentsHtml}</div>
      <div class="drawer-section"><h3>错误记录</h3>${errorsHtml}</div>
    `;
  }
  function closeDrawer() {
    els.drawer.classList.remove('open');
    els.drawer.setAttribute('aria-hidden', 'true');
    els.drawerBackdrop.classList.remove('show');
  }

  // ============ 数据加载 ============
  async function loadTasks() {
    try {
      const [tasks, summary] = await Promise.all([
        api('/api/tasks'),
        api('/api/stats/summary').catch(() => null),
      ]);
      state.tasks = Array.isArray(tasks) ? tasks : [];
      state.summary = summary;
      renderStats();
      renderTasks();
    } catch (e) {
      console.error('加载任务失败', e);
      els.tasksBody.innerHTML = `<tr><td colspan="7" class="empty">加载失败：${escapeHtml(e.message)}</td></tr>`;
    }
  }
  async function loadErrors() {
    try {
      const errors = await api('/api/errors');
      const list = Array.isArray(errors) ? errors : [];
      if (state.lastErrorCount && list.length > state.lastErrorCount) {
        showToast(`新增 ${list.length - state.lastErrorCount} 条错误记录`, 'error');
      }
      state.lastErrorCount = list.length;
      state.errors = list;
      renderErrors();
    } catch (e) {
      console.error('加载错误失败', e);
    }
  }
  async function loadSettings() {
    try {
      state.settings = await api('/api/settings');
      renderSettings();
    } catch (e) {
      els.settingsList.innerHTML = `<dd class="empty">加载配置失败</dd>`;
    }
  }
  async function loadAll() {
    await Promise.all([loadTasks(), loadErrors(), loadSettings()]);
  }

  // ============ WebSocket ============
  function updateWsStatus(status) {
    els.wsStatus.className = `ws-status ${status}`;
    const labels = { connecting: '连接中', open: '实时', closed: '已断开', reconnecting: '重连中' };
    els.wsStatus.innerHTML = `<span class="dot"></span> ${labels[status] || status}`;
  }
  function connectWS() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    updateWsStatus(state.wsRetry > 0 ? 'reconnecting' : 'connecting');
    let ws;
    try {
      ws = new WebSocket(`${proto}//${location.host}/ws/progress`);
    } catch (e) {
      updateWsStatus('closed');
      return scheduleReconnect();
    }
    state.ws = ws;
    ws.onopen = () => { state.wsRetry = 0; updateWsStatus('open'); };
    ws.onmessage = (ev) => {
      let msg; try { msg = JSON.parse(ev.data); } catch (_) { return; }
      handleWsMessage(msg);
    };
    ws.onclose = () => { updateWsStatus('closed'); scheduleReconnect(); };
    ws.onerror = () => { try { ws.close(); } catch (_) {} };
  }
  function scheduleReconnect() {
    state.wsRetry += 1;
    const delay = Math.min(30000, 1000 * Math.pow(2, state.wsRetry - 1));
    updateWsStatus('reconnecting');
    setTimeout(connectWS, delay);
  }
  function handleWsMessage(msg) {
    if (!msg || !msg.task_id) { loadAll(); return; }
    const task = state.tasks.find(t => t.id === msg.task_id);
    if (msg.status === 'completed') {
      showToast(`任务完成：${task ? basename(task.source_path) : msg.task_id.slice(0, 8)}`, 'success');
    } else if (msg.status === 'failed') {
      showToast(`任务失败：${msg.error || '未知错误'}`, 'error', 5000);
    }
    loadTasks();
    if (msg.status === 'failed' || msg.status === 'completed') loadErrors();
    if (els.drawer.classList.contains('open') && task) {
      setTimeout(() => {
        const t = state.tasks.find(x => x.id === msg.task_id);
        if (t) renderDrawer(t, undefined, state.errors.filter(e => e.task_id === t.id));
        api(`/api/tasks/${encodeURIComponent(msg.task_id)}/segments`)
          .then(segs => {
            const t2 = state.tasks.find(x => x.id === msg.task_id);
            if (t2 && els.drawer.classList.contains('open')) {
              renderDrawer(t2, segs, state.errors.filter(e => e.task_id === t2.id));
            }
          })
          .catch(() => {});
      }, 300);
    }
  }

  // ============ 上传 ============
  function addUploadItem(file) {
    const item = document.createElement('li');
    item.className = 'upload-item';
    item.innerHTML = `
      <div class="upload-item-row">
        <span class="upload-name">${escapeHtml(file.name)}</span>
        <span class="upload-meta">${formatBytes(file.size)}</span>
      </div>
      <div class="progress">
        <div class="progress-bar">
          <div class="progress-fill running" style="width:0%"></div>
        </div>
        <span class="progress-text">0%</span>
      </div>
    `;
    els.uploadList.appendChild(item);
    return item;
  }
  function updateUploadItem(item, percent, status) {
    const fill = item.querySelector('.progress-fill');
    const text = item.querySelector('.progress-text');
    fill.style.width = `${percent}%`;
    fill.className = `progress-fill ${status === 'completed' ? 'completed' : status === 'failed' ? 'failed' : 'running'}`;
    text.textContent = `${Math.round(percent)}%`;
    if (status === 'completed') item.classList.add('done');
    if (status === 'failed') item.classList.add('error');
  }
  function uploadOne(file) {
    return new Promise((resolve, reject) => {
      const xhr = new XMLHttpRequest();
      const item = addUploadItem(file);
      xhr.open('POST', '/api/upload');
      xhr.upload.onprogress = (e) => {
        if (e.lengthComputable) updateUploadItem(item, (e.loaded / e.total) * 100, 'uploading');
      };
      xhr.onload = () => {
        if (xhr.status >= 200 && xhr.status < 300) {
          updateUploadItem(item, 100, 'completed');
          let data = {};
          try { data = JSON.parse(xhr.responseText); } catch (_) {}
          showToast(`上传成功：${data.filename || file.name}`, 'success');
          setTimeout(() => { item.style.opacity = '0'; setTimeout(() => item.remove(), 300); }, 3000);
          resolve();
        } else {
          updateUploadItem(item, 0, 'failed');
          let msg = xhr.responseText;
          try { msg = JSON.parse(msg).detail || msg; } catch (_) {}
          showToast(`上传失败：${file.name} - ${msg}`, 'error', 5000);
          reject(new Error(msg));
        }
      };
      xhr.onerror = () => {
        updateUploadItem(item, 0, 'failed');
        showToast(`上传失败：${file.name} - 网络错误`, 'error', 5000);
        reject(new Error('network'));
      };
      const fd = new FormData();
      fd.append('file', file);
      xhr.send(fd);
    });
  }
  async function handleFiles(files) {
    const exts = (state.settings?.supported_extensions) || ['.mp4', '.mov', '.mkv', '.avi'];
    const max = state.settings?.max_upload_size;
    const list = Array.from(files);
    const valid = [];
    for (const f of list) {
      const suffix = '.' + f.name.split('.').pop().toLowerCase();
      if (!exts.includes(suffix)) {
        showToast(`跳过不支持的文件：${f.name}`, 'error', 4000);
        continue;
      }
      if (max && f.size > max) {
        showToast(`跳过过大文件：${f.name}（${formatBytes(f.size)}）`, 'error', 4000);
        continue;
      }
      valid.push(f);
    }
    for (const f of valid) {
      try { await uploadOne(f); } catch (_) {}
    }
    // 上传完成后等 watchdog 入队并刷新任务列表
    if (valid.length) setTimeout(loadTasks, 1000);
  }

  // ============ 主题 ============
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    els.themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
    els.themeBtn.title = theme === 'dark' ? '切换到亮色' : '切换到暗色';
    localStorage.setItem('theme', theme);
  }
  function toggleTheme() {
    const cur = document.documentElement.getAttribute('data-theme') || 'light';
    applyTheme(cur === 'dark' ? 'light' : 'dark');
  }

  // ============ 事件绑定 ============
  function bindEvents() {
    els.refreshBtn.addEventListener('click', () => {
      loadAll().then(() => showToast('数据已刷新', 'success', 1500));
    });

    els.themeBtn.addEventListener('click', toggleTheme);

    els.searchInput.addEventListener('input', debounce((e) => {
      state.filter.q = e.target.value.trim();
      renderTasks();
    }, 200));

    els.statusFilter.addEventListener('change', (e) => {
      state.filter.status = e.target.value;
      renderTasks();
    });

    els.clearErrors.addEventListener('click', () => {
      els.errorList.innerHTML = `<li class="empty">已清空当前视图（刷新后恢复）</li>`;
    });

    // 上传事件
    els.uploadZone.addEventListener('click', (e) => {
      if (e.target.closest('a')) return;
      els.fileInput.click();
    });
    els.browseLink.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
      els.fileInput.click();
    });
    els.fileInput.addEventListener('change', () => {
      if (els.fileInput.files.length) handleFiles(els.fileInput.files);
      els.fileInput.value = '';
    });
    els.uploadZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      els.uploadZone.classList.add('dragover');
    });
    els.uploadZone.addEventListener('dragleave', (e) => {
      if (e.target === els.uploadZone) els.uploadZone.classList.remove('dragover');
    });
    els.uploadZone.addEventListener('drop', (e) => {
      e.preventDefault();
      els.uploadZone.classList.remove('dragover');
      if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
    });

    // 表格事件委托
    els.tasksBody.addEventListener('click', (e) => {
      const row = e.target.closest('tr[data-task-id]');
      if (!row) return;
      if (e.target.closest('a')) return;
      openDrawer(row.getAttribute('data-task-id'));
    });
    els.tasksBody.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      const row = e.target.closest('tr[data-task-id]');
      if (!row) return;
      e.preventDefault();
      openDrawer(row.getAttribute('data-task-id'));
    });

    els.drawerClose.addEventListener('click', closeDrawer);
    els.drawerBackdrop.addEventListener('click', closeDrawer);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer(); });
  }

  // ============ 启动 ============
  function init() {
    applyTheme(localStorage.getItem('theme') || 'light');
    bindEvents();
    loadAll();
    connectWS();
    setInterval(() => { loadTasks(); }, 20000);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) loadAll();
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
