<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Anonymizer · 视频匿名化系统</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-logo">VA</div>
    <div class="brand-text">
      <h1>Video Anonymizer</h1>
      <p>视频匿名化流水线</p>
    </div>
  </div>
  <div class="topbar-actions">
    <div class="ws-status connecting" id="ws-status"><span class="dot"></span> 连接中</div>
    <button class="btn small" id="refresh-btn" title="刷新数据">刷新</button>
    <button class="btn icon-only" id="theme-btn" title="切换主题">🌙</button>
  </div>
</header>

<main>
  <section class="stats-grid" id="stats-grid"></section>

  <section class="panel">
    <div class="panel-header">
      <h2>上传视频</h2>
    </div>
    <div class="upload-zone" id="upload-zone">
      <input type="file" id="file-input" multiple accept=".mp4,.mov,.mkv,.avi" hidden>
      <div class="upload-icon">📤</div>
      <p class="upload-title">拖拽视频到此处，或 <a href="#" id="browse-link">点击选择文件</a></p>
      <p class="upload-hint" id="upload-hint">加载中...</p>
    </div>
    <ul class="upload-list" id="upload-list"></ul>
  </section>

  <section class="panel">
    <div class="panel-header">
      <h2>任务列表</h2>
      <div class="filters">
        <input type="search" id="search-input" placeholder="搜索文件名或任务 ID...">
        <select id="status-filter">
          <option value="">全部状态</option>
          <option value="queued">排队中</option>
          <option value="prechecking">预检中</option>
          <option value="compressing">压缩中</option>
          <option value="segmenting">分段中</option>
          <option value="static_processing">静态处理中</option>
          <option value="anonymizing">匿名化中</option>
          <option value="merging">合并中</option>
          <option value="completed">已完成</option>
          <option value="failed">失败</option>
        </select>
        <select id="time-filter" title="按创建时间筛选">
          <option value="">全部时间</option>
          <option value="today">今天</option>
          <option value="week">最近 7 天</option>
          <option value="month">最近 30 天</option>
        </select>
        <button class="btn small ghost" id="task-view-toggle" type="button" title="切换表格视图">简洁</button>
      </div>
    </div>
    <div class="table-wrap">
      <table class="tasks-table" id="tasks-table">
        <thead>
          <tr>
            <th>源文件</th>
            <th>状态</th>
            <th>进度</th>
            <th>输出</th>
            <th class="col-time">创建时间</th>
            <th class="col-duration">耗时</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tasks-body">
          <tr><td colspan="7" class="empty">加载中...</td></tr>
        </tbody>
      </table>
    </div>
    <div class="panel-footer" id="tasks-pager"></div>
  </section>

  <div class="two-col">
    <section class="panel">
      <div class="panel-header">
        <h2>Input 文件</h2>
        <div class="filters">
          <span class="muted" id="input-files-count"></span>
          <button class="btn small ghost" id="input-files-refresh" type="button">刷新</button>
        </div>
      </div>
      <div class="table-wrap">
        <table class="tasks-table">
          <thead>
            <tr>
              <th>文件名</th>
              <th>大小</th>
              <th>状态</th>
              <th>修改时间</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="input-files-body">
            <tr><td colspan="5" class="empty">加载中...</td></tr>
          </tbody>
        </table>
      </div>
      <div class="panel-footer" id="input-pager"></div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2>Output 文件</h2>
        <div class="filters">
          <span class="muted" id="output-files-count"></span>
          <button class="btn small ghost" id="output-files-refresh" type="button">刷新</button>
        </div>
      </div>
      <div class="table-wrap">
        <table class="tasks-table">
          <thead>
            <tr>
              <th>文件名</th>
              <th>大小</th>
              <th>生成时间</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="output-files-body">
            <tr><td colspan="4" class="empty">加载中...</td></tr>
          </tbody>
        </table>
      </div>
      <div class="panel-footer" id="output-pager"></div>
    </section>
  </div>

  <div class="two-col">
    <section class="panel">
      <div class="panel-header">
        <h2>错误日志</h2>
        <button class="btn small ghost" id="clear-errors" title="清空当前视图">清空显示</button>
      </div>
      <ul class="error-list" id="error-list">
        <li class="empty">加载中...</li>
      </ul>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2>运行配置</h2>
        <button class="btn small ghost" id="settings-edit-btn" type="button">编辑</button>
      </div>
      <dl class="settings-list" id="settings-list">
        <dd class="empty">加载中...</dd>
      </dl>
    </section>
  </div>
</main>

<aside class="drawer" id="drawer" aria-hidden="true">
  <div class="drawer-header">
    <h2>任务详情</h2>
    <button class="btn icon-only ghost" id="drawer-close" aria-label="关闭">✕</button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
</aside>
<div class="drawer-backdrop" id="drawer-backdrop"></div>

<div class="toast-container" id="toast-container"></div>

<script src="/js/app.js"></script>
</body>
</html>
